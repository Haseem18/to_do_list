<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    
    <div id="root">
        <div class="to_do_container">
            <h1>To Do List</h1>
            <form class="user_input_container">
                <div class="task_bar">
                    <input type="text" placeholder="Enter a task..." name="task" autofocus >
                    <img src="./mic.png" alt="">
                </div>
                <button>Submit</button>
            </form>

            <ul class="user_task_container">
                
            </ul>
        </div>
    </div>

    <script src="./main.js"></script>

</body>
</html>
